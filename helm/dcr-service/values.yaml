# Default values for dcr-service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: registry.example.com/dcr-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/dcr-service-role
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  hosts:
    - host: dcr.example.com
      paths:
        - path: /openbanking/register
          pathType: Prefix
  tls:
    - secretName: dcr-tls
      hosts:
        - dcr.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - dcr-service
        topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"
  - name: JAVA_OPTS
    value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+UseStringDeduplication"
  - name: OTEL_SERVICE_NAME
    value: "dcr-service"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"

# External configuration from ConfigMap
configMapRef:
  name: dcr-config

# Secrets from External Secrets or Sealed Secrets
secretRefs:
  - dcr-secrets

# Configuration for DCR Service
config:
  dcr:
    directory:
      jwksUrl: "https://directory.sandbox.openfinancebrasil.org.br/jwks"
      jwksTtlSeconds: 300
    ssa:
      iatSkewSeconds: 60
      allowedIssuers:
        - "Open Banking Open Banking Brasil prod SSA issuer"
    idempotency:
      ttlSeconds: 600
    rate:
      perMinutePerOrg: 100
    keycloak:
      adminUrl: "https://auth.example.com/admin"
      realm: "open-finance"
      parRequired: true
    observability:
      tracingEnabled: true
      metricsEnabled: true
    audit:
      s3Bucket: "dcr-audit-worm"
      s3Prefix: "audit/"

# Database configuration
database:
  host: "dcr-db.example.com"
  port: 5432
  name: "dcr_registry"
  poolSize: 20
  connectionTimeout: 5000
  maxLifetime: 1800000

# Redis configuration
redis:
  host: "dcr-redis.example.com"
  port: 6379
  database: 0
  timeout: 2000
  poolSize: 10

# SNS/SQS configuration
messaging:
  sns:
    topicArn: "arn:aws:sns:us-east-1:123456789012:dcr-events"
  sqs:
    queueUrl: "https://sqs.us-east-1.amazonaws.com/123456789012/dcr-audit"

# Network Policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: api-gateway
      ports:
      - protocol: TCP
        port: 8080
  egress:
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443  # HTTPS
      - protocol: TCP
        port: 5432 # PostgreSQL
      - protocol: TCP
        port: 6379 # Redis
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 53   # DNS
      - protocol: UDP
        port: 53

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Volume mounts for temp files (readOnlyRootFilesystem=true)
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /app/cache

volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}
